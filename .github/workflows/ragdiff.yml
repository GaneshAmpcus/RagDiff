name: RagDiff

# Dogfood: runs the local action on this repo's own sample app.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ragdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base and head revisions must both be available
      - uses: ./
        with:
          config: examples/sample_rag/evals.ci.yaml
