name: RagDiff
description: >-
  Compare a RAG app between a PR and its base, comment the verdict and culprit
  on the PR, and optionally fail the check on a regression.
branding:
  icon: git-pull-request
  color: blue

inputs:
  config:
    description: Path to evals.yaml (relative to working-directory).
    default: evals.yaml
  base-ref:
    description: Base git revision to compare against.
    default: ${{ github.event.pull_request.base.sha }}
  head-ref:
    description: Head git revision under test.
    default: ${{ github.event.pull_request.head.sha }}
  working-directory:
    description: Directory to run in (must be inside the checked-out repo).
    default: "."
  python-version:
    description: Python version to run RagDiff with.
    default: "3.11"
  extras:
    description: RagDiff extras to install, e.g. "llm,metrics".
    default: ""
  install-command:
    description: Command that installs your app's own dependencies.
    default: ""
  comment:
    description: Post or update one comment on the pull request.
    default: "true"
  fail-on-regression:
    description: Fail this step when the verdict is "fail".
    default: "true"
  github-token:
    description: Token used to post the comment (needs pull-requests write).
    default: ${{ github.token }}

outputs:
  verdict:
    description: pass, fail or inconclusive.
    value: ${{ steps.compare.outputs.verdict }}
  culprit:
    description: retrieval, prompt, model, generation, multiple or unknown (fail only).
    value: ${{ steps.compare.outputs.culprit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install RagDiff and the app
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTRAS: ${{ inputs.extras }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "$EXTRAS" ]; then
          python -m pip install "${GITHUB_ACTION_PATH}[${EXTRAS}]"
        else
          python -m pip install "${GITHUB_ACTION_PATH}"
        fi
        if [ -n "$INSTALL_COMMAND" ]; then
          eval "$INSTALL_COMMAND"
        fi

    - name: Compare base and head
      id: compare
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_REF: ${{ inputs.head-ref }}
      run: |
        out_dir="${RUNNER_TEMP}/ragdiff"
        mkdir -p "$out_dir"
        set +e
        ragdiff compare --config "$CONFIG" \
          --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
          --report-path "$out_dir/report.md" 2>&1 | tee "$out_dir/output.txt"
        code=${PIPESTATUS[0]}
        set -e
        # Exit code 1 is also what an uncaught error returns; the report file
        # only exists when the comparison itself completed.
        if [ ! -f "$out_dir/report.md" ]; then
          echo "::error::RagDiff failed before producing a report (exit $code)"
          exit "$code"
        fi
        echo "report-path=$out_dir/report.md" >> "$GITHUB_OUTPUT"
        echo "verdict=$(sed -n 's/^Verdict: //p' "$out_dir/output.txt" | head -1)" >> "$GITHUB_OUTPUT"
        echo "culprit=$(sed -n 's/^Culprit: \([a-z]*\).*/\1/p' "$out_dir/output.txt" | head -1)" >> "$GITHUB_OUTPUT"

    - name: Publish report
      if: always() && steps.compare.outputs.report-path != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT_PATH: ${{ steps.compare.outputs.report-path }}
        POST_COMMENT: ${{ inputs.comment }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/post_comment.sh"

    - name: Gate the merge
      if: inputs.fail-on-regression == 'true' && steps.compare.outputs.verdict == 'fail'
      shell: bash
      env:
        CULPRIT: ${{ steps.compare.outputs.culprit }}
      run: |
        echo "::error::RagDiff found a quality regression (culprit: ${CULPRIT:-unknown})"
        exit 1
