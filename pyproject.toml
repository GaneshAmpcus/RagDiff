[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdiff"
version = "0.1.0"
description = "A core-only library and CLI for evaluating RAG applications"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
llm = ["litellm>=1.40,<2"]
metrics = ["ragas==0.1.9"]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.5", "types-PyYAML>=6.0"]

[project.scripts]
ragdiff = "ragdiff.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragdiff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
