# Phase 0 infrastructure. The `api` and `worker` services are added in Phase 4,
# once the FastAPI app and Celery worker exist.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ragdiff
      POSTGRES_PASSWORD: ragdiff
      POSTGRES_DB: ragdiff
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragdiff"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
